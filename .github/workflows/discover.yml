name: 지원금 페이지 구조 탐색

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브라우저 준비
        run: |
          pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: 3사 지원금 페이지 탐색
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python scripts/collectors/discover.py

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery/
          retention-days: 7
