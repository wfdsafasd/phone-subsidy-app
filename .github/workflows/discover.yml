name: 지원금 페이지 구조 탐색

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브라우저 준비
        run: |
          pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: 3사 지원금 페이지 탐색
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python scripts/collectors/discover.py

      - name: 결과를 discovery-results 브랜치에 저장
        if: always()
        run: |
          git config user.name "subsidy-bot"
          git config user.email "subsidy-bot@users.noreply.github.com"
          git checkout --orphan discovery-results
          git rm -r --cached . -q
          git add -f discovery/
          git commit -m "탐색 결과 $(date -u +%FT%TZ)"
          git push -f origin discovery-results
